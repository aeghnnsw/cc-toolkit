name: CI

# One job on Linux and one on macOS run the package validator, the root tests, and the plugin test suites
# on each pull request.
# The commands match the Verification table in CONTRIBUTING.md.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    # Core Hooks and Dev Skills run on Linux and macOS hosts, so the suites run on both (#496).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # The default ref is the merge of the pull request into its target, so the validator compares the
      # merged result with the current master.
      - name: Check out the merge result
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch master
        run: git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # zsh runs the zsh cases of the Core Hooks and Dev Skills suites, and jq runs the cc-customize checks.
      # The productivity-skills suite needs initdb, pg_ctl, and psql; the Linux runner installs PostgreSQL
      # outside PATH. A missing tool fails the check step below, so that no suite skips its cases.
      - name: Install the Linux test tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q zsh jq
          ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1 >> "$GITHUB_PATH"

      # On macOS, use the PostgreSQL that Homebrew has installed, or install one.
      - name: Put the PostgreSQL tools on PATH
        if: runner.os == 'macOS'
        run: |
          for dir in "$(brew --prefix)"/opt/postgresql@*/bin; do
            if [ -x "$dir/initdb" ]; then
              echo "$dir" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          brew install postgresql@17
          echo "$(brew --prefix postgresql@17)/bin" >> "$GITHUB_PATH"

      - name: Check the test tools
        run: command -v git jq lsof python3 uv zsh initdb pg_ctl psql

      - name: Package validator
        if: ${{ !cancelled() }}
        run: uv run --no-project --python '>=3.11' python scripts/validate_packages.py --base origin/master

      - name: Root tests
        if: ${{ !cancelled() }}
        run: uv run --no-project --python '>=3.11' python -m unittest discover -s tests -p 'test_*.py'

      - name: CC Customize tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s cc-customize/tests -p 'test_*.py'

      - name: Core Hooks tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s core-hooks/tests -p 'test_*.py'

      - name: Creator Skills tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s creator-skills/tests -p 'test_*.py'

      - name: Dev Skills tests
        if: ${{ !cancelled() }}
        # pytest and pytest-cov let the lean-tests checks that run pytest run instead of skip.
        run: uv run --no-project --python '>=3.11' --with pytest --with pytest-cov python -m unittest discover -s dev-skills/tests -p 'test_*.py'

      - name: PyMOL Skills tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s pymol-skills/tests -p 'test_*.py'

      - name: Productivity Skills tests
        if: ${{ !cancelled() }}
        run: uv run --no-project --python '>=3.11' python -m unittest discover -s productivity-skills/tests -p 'test_*.py'

      - name: Task Loop tests
        if: ${{ !cancelled() }}
        run: uv run --no-project --python '>=3.11' --with 'httpx>=0.27' python -m unittest discover -s task-loop/tests -p 'test_*.py'
